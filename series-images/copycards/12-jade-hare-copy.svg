<text x="76" y="370" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="600">月弧和竖线，留下生肖的暗示。</text>
<foreignObject x="76" y="430" width="610" height="150"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:22px;line-height:1.55;color:#fff;opacity:.82">把玉兔的月夜联想抽象成柔和月弧和两条竖向切线，以珍珠灰、象牙和青玉色表达东方静谧。禁止卡通兔形和直白生肖图案。</div></foreignObject>
